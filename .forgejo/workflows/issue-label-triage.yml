# Human-activity triage: when a person (not the shared `xpufx` agent identity)
# opens an issue or posts an issue comment, make sure the exclusive
# `attention/orchestrator` label is the effective attention signal.
#
# Why a host-mode runner: this is a handful of wget calls, so there is no
# reason to pay for a container image to be pulled/started. A runner registered
# with a `host`-backend label executes the steps directly on the host, which is
# faster and cheaper for small operations.
#
# RUNNER LABEL: this instance's host runner is registered as
# `runner-local-shell` (host backend, no container). `runs-on` matches the
# label name. No `container:` block is present on purpose: that is what selects
# the host backend.
#
# RUNTIME DEPENDENCIES: host mode runs on the host, so the host itself must
# provide `wget`. The host runner has BusyBox `wget` (no `curl`), so this
# workflow uses only BusyBox-supported options: `--header`, `--post-data`,
# `-q`, and `-O -`. BusyBox `wget`'s exit status on HTTP 4xx/5xx is not
# uniform across builds, so success is confirmed from the response body, never
# the exit status. `jq` is OPTIONAL: used for JSON field extraction when
# present, otherwise a string match is used. The workflow fails loudly if
# `wget` is missing.
#
# Trigger conditions
#   - issues        : opened   (a new issue)
#   - issue_comment : created  (a comment on an issue or PR)
#
# Actor / human-vs-`xpufx` check
#   All agents share the `@xpufx` forge account, so `github.actor == xpufx`
#   means the action was automated; anything else is treated as a human. The
#   job no-ops (exits 0) when the actor is `xpufx`.
#
# Exclusive-label logic
#   `attention/*` labels are `exclusive: true`, so the Forgejo DB evicts any
#   other `attention/*` label the moment a new one is added. This workflow
#   therefore only ADDS `attention/orchestrator` (via
#   `POST /repos/{owner}/{repo}/issues/{n}/labels`) and lets the scope
#   exclusivity evict other attention labels. It does not touch any other scope.
#
# Idempotence / loops
#   No-ops when `attention/orchestrator` or `attention/0-orchestrator` is already
#   present. The workflow only writes a label (never a comment or a new issue),
#   and adding a label emits an `issues:labeled` event, which is not a trigger
#   here, so it cannot re-trigger itself.
name: Issue label triage (host runner)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  triage:
    name: Ensure attention/orchestrator for human activity
    runs-on: runner-local-shell # host runner label; no container
    steps:
      - name: Set attention/orchestrator (human only)
        env:
          # Forgejo auto-injects the run's own task token under these names; it
          # carries write access to this repository.
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -eu

          command -v wget >/dev/null 2>&1 || { echo "::error::wget is required on the host runner"; exit 1; }

          # `jq` is optional: BusyBox images may not ship it, so fall back to a
          # plain string match when it is absent.
          have_jq=0
          if command -v jq >/dev/null 2>&1; then
            have_jq=1
          fi

          # All agents share the `xpufx` account: that actor is automated, not a
          # human, so there is nothing to do.
          if [ "$ACTOR" = "xpufx" ]; then
            echo "actor '$ACTOR' is the shared agent identity; skipping"
            exit 0
          fi

          auth_header="Authorization: token ${FORGEJO_TOKEN}"

          # GET a URL's body to stdout. BusyBox `wget` supports `--header` and
          # `-O -` but not `-f`/`-sS`; its exit status on HTTP errors is not
          # uniform, so callers validate the body instead of the exit status.
          api_get() {
            wget -q -O - --header "$auth_header" "$1"
          }

          api_post() {
            wget -q -O - --post-data "$2" \
              --header "$auth_header" --header "Content-Type: application/json" "$1"
          }

          has_label() {
            if [ "$have_jq" = 1 ]; then
              printf '%s' "$1" | jq -e --arg label "$2" 'any(.[]; .name == $label)' >/dev/null
            else
              printf '%s' "$1" | grep -Fq "\"name\":\"$2\"" || printf '%s' "$1" | grep -Fq "\"name\": \"$2\""
            fi
          }

          # True when the issue object carries a non-null `pull_request` (i.e.
          # the event is for a PR). Forgejo omits the field entirely for real
          # issues, so its presence as an object is authoritative.
          is_pull_request() {
            if [ "$have_jq" = 1 ]; then
              printf '%s' "$1" | jq -r '.pull_request != null' | grep -q '^true$'
            else
              printf '%s' "$1" | grep -Eq '"pull_request"[[:space:]]*:[[:space:]]*\{'
            fi
          }

          # Skip pull requests. The workflow targets issues; a PR comment shares
          # the same event shape, and the issues API reports `pull_request` for
          # a PR, so this is the authoritative check.
          issue_json="$(api_get "${API_URL}/repos/${REPO}/issues/${ISSUE}")"
          if [ -z "$issue_json" ]; then
            echo "::error::empty response fetching issue #${ISSUE} (HTTP error or auth failure?)"
            exit 1
          fi
          if is_pull_request "$issue_json"; then
            echo "issue #${ISSUE} is a pull request; skipping"
            exit 0
          fi

          labels_json="$(api_get "${API_URL}/repos/${REPO}/issues/${ISSUE}/labels")"

          # stop-work is a hard circuit breaker, including for SOS. SOS can
          # otherwise break through completed/ignored terminal states, matching
          # the board's emergency precedence. Triage never changes state/* or
          # review/*, so an active review or lifecycle transition is preserved.
          if has_label "$labels_json" "flag/stop-work"; then
            echo "stop-work is set; skipping"
            exit 0
          fi

          sos=0
          if has_label "$labels_json" "priority/0-SOS" || has_label "$labels_json" "priority/0-sos" || has_label "$labels_json" "priority/sos"; then
            sos=1
          fi

          if [ "$sos" = 0 ]; then
            for terminal in flag/wont-do state/4-done state/done attention/3-ignore attention/2-ignore attention/ignore confirmed-done; do
              if has_label "$labels_json" "$terminal"; then
                echo "terminal label $terminal is set; skipping"
                exit 0
              fi
            done
          fi

          # Already triaged: `attention/orchestrator` or `attention/0-orchestrator` is present, no-op.
          if has_label "$labels_json" "attention/orchestrator" || has_label "$labels_json" "attention/0-orchestrator"; then
            echo "issue #${ISSUE} already has attention/orchestrator; nothing to do"
            exit 0
          fi

          # Add it. Because `attention/*` is an exclusive scope, this single add
          # evicts whatever attention label is currently set. An HTTP error here
          # may or may not set a nonzero exit status, so the write is verified by
          # re-reading the labels below rather than trusting the exit code.
          echo "human actor '${ACTOR}' on issue #${ISSUE}: setting attention/orchestrator"
          api_post "${API_URL}/repos/${REPO}/issues/${ISSUE}/labels" '{"labels":["attention/orchestrator"]}' >/dev/null

          # Confirm the write landed (and that the label is defined on the repo);
          # accept either numberless or legacy numeric if repo hasn't synced yet.
          labels_json="$(api_get "${API_URL}/repos/${REPO}/issues/${ISSUE}/labels")"
          if ! (has_label "$labels_json" "attention/orchestrator" || has_label "$labels_json" "attention/0-orchestrator"); then
            echo "::error::attention/orchestrator was not applied to issue #${ISSUE} (is the label defined on the repo?)"
            exit 1
          fi
          echo "issue #${ISSUE}: attention/orchestrator set"
