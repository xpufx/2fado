# Cross-platform build & release package caller workflow.
# Multi-forge compatible caller running across Forgejo Actions and GitHub Actions.
# Triggers on release publication, push of version tags ('v*'), or manual workflow_dispatch.
# Delegates to reusable workflow .github/workflows/reusable-cross-build.yml running on ubuntu-24.04.

name: Cross-platform build & release package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target build version override (e.g. 0.2.0)'
        required: false
        type: string
        default: ''
      upload_release_assets:
        description: 'Upload / mirror release assets'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & package cross-platform release artifacts
    uses: ./.github/workflows/reusable-cross-build.yml
    with:
      version: ${{ inputs.version || '' }}
      upload_release_assets: ${{ github.event_name == 'release' || inputs.upload_release_assets == true }}
      release_id: ${{ github.event.release.id || 0 }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
